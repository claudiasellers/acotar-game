name: Build Terrain3D binaries

# Builds the Terrain3D GDExtension from its pinned release tag for the
# platforms we ship (macOS universal for the user's Mac, Linux x86_64 for CI),
# so the binaries are built from source rather than downloaded.
on:
  workflow_dispatch:
  push:
    branches: ["lane/world-**"]
    paths: [".github/workflows/terrain3d-build.yml"]

env:
  TERRAIN3D_TAG: "v1.1.0-rc1"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: macos-latest
            platform: macos
            arch: universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TokisanGames/Terrain3D
          ref: ${{ env.TERRAIN3D_TAG }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install scons==4.10.1
      - name: Build debug and release
        run: |
          scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=template_debug debug_symbols=no -j4
          scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=template_release debug_symbols=no -j4
      - uses: actions/upload-artifact@v4
        with:
          name: terrain3d-${{ matrix.platform }}
          path: project/addons/terrain_3d/bin/
          retention-days: 3

  # Commit the binaries (plain git: the cloud sessions can't reach LFS) to a side branch so lanes can fetch them;
  # the world lane copies them into addons/terrain_3d/bin/ on its own branch.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bin
          merge-multiple: true
      - name: Commit to vendor/terrain3d-bin
        run: |
          git init -q out && cd out
          git checkout -q -b vendor/terrain3d-bin
          mkdir -p bin && cp -r ../bin/* bin/
          echo "bin/** -text" > .gitattributes
          echo "Terrain3D ${TERRAIN3D_TAG} built from source by ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID}" > README.md
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Terrain3D ${TERRAIN3D_TAG} binaries"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" vendor/terrain3d-bin
