# name | outputs (git-ignored) | build command | inputs (git pathspecs)
# Inputs come from the Makefile's bake rule, plus the .tres files that list the
# height providers. Keep them complete: a missed input means a stale build.
terrain | world/shared/terrain/data | "$MQ_BIN/godot.sh" -s world/shared/terrain/bake_terrain.gd | :(glob)world/**/*height*.gd :(glob)world/**/*height*.tres :(glob)world/**/*terrain*.gd world/shared/world_map.gd
woods_scatter | world/spring_court/border_woods/_generated world/spring_court/eastern_woods/_generated world/spring_court/suriel_glade/_generated | "$MQ_BIN/godot.sh" -s tools/generators/woods_scatter.gd | tools/generators/woods_scatter.gd :(glob)world/spring_court/shared/** :(glob)world/spring_court/border_woods/** :(glob)world/spring_court/eastern_woods/** :(glob)world/spring_court/suriel_glade/** :(glob)world/**/*height*.gd :(glob)world/**/*height*.tres
world_map | ui/map/_generated | "$MQ_BIN/godot.sh" -s tools/generators/world_map.gd | tools/generators/world_map.gd :(glob)ui/map/** :(glob)data/map/** :(glob)world/spring_court/shared/** :(glob)world/spring_court/border_woods/** :(glob)world/spring_court/eastern_woods/** :(glob)world/spring_court/suriel_glade/**
