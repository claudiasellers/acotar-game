# The gate. One test per line; a line fails if its command exits non-zero.
#   name = command             runs in the worktree under test
#   first: name = command      runs alone, in order, before everything else
#   needs:other name = ...     starts only after line `other` has passed; if it
#                              didn't, this line doesn't run. Unmarked lines run
#                              beside it. A `# gate: needs:other` line in a test
#                              file does the same for that @gut test.
#   when:a/*,*.x name = ...    only when the change touches a matching file
#   gfx: name = ...            needs a real window; skipped here, and listed
#   @gut tests                 one line per tests/**/test_*.gd, found at run
#                              time, so adding a test never edits this file
# Idle full gates pass no --base, so when: lines all run, world_smoke strictly.
first: parse = "$MQ_BIN/parse.sh"
first: levels-check = "$MQ_BIN/levels.sh" check
# Everything but the terrain bake, which is a line of its own: 14 minutes when
# its inputs change, and only tests that load World read it (levels.sh check).
first: levels = MQ_LEVELS_SKIP=terrain "$MQ_BIN/levels.sh" ensure
terrain = "$MQ_BIN/levels.sh" ensure terrain
when:tools/mq/* selftest = bash tools/mq/selftest.sh
when:tools/mq/shots* shots-selftest = bash tools/mq/shots_selftest.sh
@gut tests
when:world/*,data/regions/* smoke = "$MQ_BIN/godot.sh" -s tools/world_smoke.gd ${MQ_GATE_BASE:+-- --changed-since=$MQ_GATE_BASE}
boot = "$MQ_BIN/godot.sh" --quit-after 120
