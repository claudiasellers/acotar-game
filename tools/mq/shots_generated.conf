# Generated content the shot listener reuses instead of rebuilding.
# One line per generator:  name | Godot run (headless) | outputs | inputs
#   outputs: space-separated folders; only their git-ignored files are cached.
#   inputs:  one extended regex over repo paths. The cache key is the git blob
#            ids of every matching file, so content is rebuilt only when one of
#            its inputs changed in the request's commit.
# A tools/generators/*.gd not listed here still runs, uncached, on every request.
# Owners: add your generator here when you add one (docs/contracts/shots.md §2).

terrain | -s res://world/shared/terrain/bake_terrain.gd | world/shared/terrain/data | ^(world/shared/terrain/|world/human_realm/shared/|world/spring_court/[a-z_]+/[a-z_]+_terrain\.gd$|world/spring_court/manor_estate/terrain/|world/spring_court/wider/court_height\.gd$|addons/terrain_3d/)

woods | -s res://tools/generators/woods_scatter.gd | world/spring_court/border_woods/_generated world/spring_court/eastern_woods/_generated world/spring_court/suriel_glade/_generated | ^(tools/generators/woods_scatter\.gd$|world/spring_court/(shared|border_woods|eastern_woods|suriel_glade)/|world/shared/scatter/|world/shared/terrain/|world/human_realm/shared/|world/spring_court/[a-z_]+/[a-z_]+_terrain\.gd$|world/spring_court/manor_estate/terrain/|world/spring_court/wider/court_height\.gd$)

manor | res://tools/manor_estate/gen_grounds.tscn | world/spring_court/manor_estate/scatter | ^(tools/manor_estate/|world/spring_court/manor_estate/|world/shared/scatter/|world/shared/terrain/)
